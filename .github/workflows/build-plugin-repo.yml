name: Build Plugin Repository (all plugins)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Compile all plugins and publish repo
    runs-on: ubuntu-24.04
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbo-k2p-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils \
            autopoint gettext ccache autoconf automake liblzma-dev \
            libltdl-dev liblzo2-dev curl xz-utils build-essential jq fakeroot

      - name: Download upstream source
        run: |
          curl -fL --retry 3 -o padavan.tar.gz \
            https://codeload.github.com/TurBoTse/padavan/tar.gz/refs/heads/main
          mkdir -p src
          tar -xzf padavan.tar.gz -C src --strip-components=1

      - name: Seed udns source
        run: |
          mkdir -p src/trunk/download
          curl -fL --retry 3 -o src/trunk/download/udns-0.6.tar.gz \
            https://deb.debian.org/debian/pool/main/u/udns/udns_0.6.orig.tar.gz
          echo "696a2d0d518da985d975a65e11d166f3f57cdbd1d42376a0b85307f49601c6e8  src/trunk/download/udns-0.6.tar.gz" | sha256sum -c -

      - name: Fetch NanoAd source (password-free build)
        run: |
          curl -fL --retry 3 -o nanoad-inject.tar.gz \
            https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/nanoad-inject.tar.gz
          mkdir -p src/nanoad-src
          tar -xzf nanoad-inject.tar.gz -C src/nanoad-src --strip-components=3 trunk/user/adbyby
          echo "NanoAd source ready at src/nanoad-src"
          ls src/nanoad-src/src

      - name: Fetch plugin packaging assets
        run: |
          BASE=https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugin-build
          curl -fL --retry 3 -o src/build_extra_plugins.py "$BASE/build_extra_plugins.py"
          mkdir -p src/plugin_patch/nanoad src/plugin_patch/adbyby
          for kind in nanoad adbyby; do
            for f in install.sh start.sh stop.sh; do
              curl -fL --retry 3 -o "src/plugin_patch/$kind/$f" "$BASE/$kind/$f"
            done
          done
          echo "packaging assets ready"

      - name: Enable all plugins in config
        working-directory: src
        run: |
          CFG=trunk/configs/templates/K2P.config
          # Plugins that compile cleanly as standalone pieces; exclude ones needing
          # kernel modules, extra partitions or conflicting WebUI slots.
          for m in \
            HTOP NANO IPERF3 TTYD SOCAT MTR LRZSZ TCPDUMP CURL \
            SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS \
            REDSOCKS \
            SMARTDNS ALIDDNS DDNSTO \
            FRPC FRPS FTPD \
            MSD_LITE VLMCSD MENTOHUST U2EC \
            SCUTCLIENT DOGCOM GDUT_DRCOM MINIEAP NJIT_CLIENT SRELAY; do
            echo "CONFIG_FIRMWARE_INCLUDE_${m}=y" >> "$CFG"
          done
          echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=y" >> "$CFG"
          echo "--- enabled count ---"
          grep -c 'CONFIG_FIRMWARE_INCLUDE_.*=y' "$CFG"

      - name: Build firmware
        working-directory: src
        run: make K2P TOOLCHAIN=mipsel-linux-musl

      - name: Inspect romfs and link types
        working-directory: src
        run: |
          echo "=== romfs top dirs ==="
          find trunk/romfs -maxdepth 2 -type d | sort | head -60
          echo "=== sample bin link types ==="
          for b in htop nano iperf3 ttyd socat mtr xray sing-box frpc smartdns; do
            f=$(find trunk/romfs -name "$b" -type f 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              printf '%-12s ' "$b"
              file "$f" | sed 's/.*: //'
            fi
          done
          echo "=== shared libs present ==="
          find trunk/romfs -name '*.so*' -type f | head -40
          echo "=== total romfs size ==="
          du -sh trunk/romfs

      - name: Package plugins
        working-directory: src
        run: |
          set -e
          ROOT=$PWD
          PKGDIR=$ROOT/plugin-repo
          mkdir -p "$PKGDIR"
          # Each plugin: name|space-separated relative paths under romfs
          # Paths are matched with find; multiple matches allowed.
          cat > /tmp/plugin_map.txt <<'MAP'
          htop|usr/bin/htop
          nano|usr/bin/nano
          iperf3|usr/bin/iperf3
          ttyd|usr/bin/ttyd
          socat|usr/bin/socat
          mtr|usr/bin/mtr
          lrzsz|usr/bin/lrz usr/bin/sz usr/bin/rz
          tcpdump|usr/bin/tcpdump
          shadowsocks|usr/bin/ss-local usr/bin/ss-redir usr/bin/ss-server
          xray|usr/bin/xray
          v2ray|usr/bin/v2ray
          trojan|usr/bin/trojan
          ssobfs|usr/bin/obfs-local usr/bin/obfs-server
          singbox|usr/bin/sing-box
          naiveproxy|usr/bin/naive
          redsocks|usr/bin/redsocks
          microsocks|usr/bin/microsocks
          smartdns|usr/bin/smartdns
          adguardhome|usr/bin/AdGuardHome
          aliddns|usr/bin/aliddns
          ddnsto|usr/bin/ddnsto
          aldriver|usr/bin/aliyundrive-webdav
          frp|usr/bin/frpc usr/bin/frps
          aria2|usr/bin/aria2c
          transmission|usr/bin/transmission-daemon
          minidlna|usr/bin/minidlna
          firefly|usr/bin/firefly
          xupnpd|usr/bin/xupnpd
          vsftpd|usr/sbin/vsftpd
          dump1090|usr/bin/dump1090
          msd_lite|usr/bin/msd_lite
          vlmcsd|usr/bin/vlmcsd
          mentohust|usr/bin/mentohust
          u2ec|usr/bin/u2ec
          scutclient|usr/bin/scutclient
          dogcom|usr/bin/dogcom
          gdut_drcom|usr/bin/gdut-drcom
          minieap|usr/bin/minieap
          srelay|usr/bin/srelay
          chinadns_ng|usr/bin/chinadns-ng
          dns2tcp|usr/bin/dns2tcp
          dnsproxy|usr/bin/dnsproxy
          ipt2socks|usr/bin/ipt2socks
          MAP
          python3 - <<'PY'
          import os, json, hashlib, tarfile, fnmatch
          root = os.getcwd()
          romfs = os.path.join(root, 'trunk', 'romfs')
          pkgdir = os.path.join(root, 'plugin-repo')
          fancy = {
            'htop':'系统监控','nano':'终端编辑器','iperf3':'网络测速','ttyd':'网页终端',
            'socat':'网络工具','mtr':'路由追踪','lrzsz':'ZMODEM传输','tcpdump':'抓包工具',
            'shadowsocks':'Shadowsocks','xray':'Xray','v2ray':'V2Ray','trojan':'Trojan',
            'ssobfs':'simple-obfs','singbox':'Sing-box','naiveproxy':'NaiveProxy',
            'redsocks':'Redsocks','microsocks':'MicroSocks','smartdns':'SmartDNS',
            'adguardhome':'AdGuard Home','aliddns':'阿里云DDNS','ddnsto':'DDNSTO',
            'aldriver':'阿里云盘WebDAV','frp':'Frp内网穿透','aria2':'Aria2下载',
            'transmission':'Transmission','minidlna':'MiniDLNA','firefly':'Firefly DLNA',
            'xupnpd':'XUPnPD','vsftpd':'FTP服务器','dump1090':'ADS-B接收','msd_lite':'组播转单播',
            'vlmcsd':'KMS激活','mentohust':'锐捷认证','u2ec':'U2EC','scutclient':'SCUT认证',
            'dogcom':'校园网认证','gdut_drcom':'校园网认证','minieap':'校园网认证',
            'srelay':'SOCKS代理','chinadns_ng':'ChinaDNS-NG','dns2tcp':'DNS over TCP',
            'dnsproxy':'DNS代理','ipt2socks':'iptables转socks',
          }
          index = []
          for line in open('/tmp/plugin_map.txt', encoding='utf-8'):
            line=line.strip()
            if not line or '|' not in line: continue
            name, paths = line.split('|',1)
            paths = paths.split()
            found=[]
            for pat in paths:
              for dp,_,fs in os.walk(romfs):
                for f in fs:
                  full=os.path.join(dp,f)
                  rel=os.path.relpath(full,romfs)
                  if fnmatch.fnmatch(rel,pat) or fnmatch.fnmatch(f,os.path.basename(pat)):
                    if full not in found: found.append(full)
            if not found:
              print('SKIP (not found):', name, paths); continue
            # create package dir mirroring romfs paths
            tmpd=os.path.join('/tmp','pk_'+name)
            os.makedirs(tmpd,exist_ok=True)
            manifest={'name':name,'title':fancy.get(name,name),'arch':'mipsel-linux-musl','files':[]}
            for full in found:
              rel=os.path.relpath(full,romfs)
              dst=os.path.join(tmpd,rel)
              os.makedirs(os.path.dirname(dst),exist_ok=True)
              import shutil; shutil.copy2(full,dst)
              manifest['files'].append(rel)
            mpath=os.path.join(tmpd,'manifest.json')
            with open(mpath,'w',encoding='utf-8') as f: json.dump(manifest,f,ensure_ascii=False)
            out=os.path.join(pkgdir,name+'.tar.gz')
            with tarfile.open(out,'w:gz') as tf:
              for dp,_,fs in os.walk(tmpd):
                for f in fs:
                  full=os.path.join(dp,f)
                  tf.add(full, os.path.relpath(full,tmpd))
            sha=hashlib.sha256(open(out,'rb').read()).hexdigest()
            index.append({'name':name,'title':fancy.get(name,name),'file':name+'.tar.gz',
                          'size':os.path.getsize(out),'sha256':sha,'files':manifest['files']})
            print('PACKED',name,os.path.getsize(out),'bytes',len(manifest['files']),'files')
          with open(os.path.join(pkgdir,'plugins.json'),'w',encoding='utf-8') as f:
            json.dump({'arch':'mipsel-linux-musl','build':os.environ.get('BUILD_DATE',''),'plugins':index},f,ensure_ascii=False,indent=2)
          # TSV index consumed by the router-side pluginctl (pure awk, no jq/python)
          with open(os.path.join(pkgdir,'plugins.txt'),'w',encoding='utf-8') as f:
            # No comment line: router-side pluginctl treats every NF>=4 line as a plugin.
            for it in index:
                f.write('%s|%s|%s|%s|%s\n' % (it['name'],it['title'],it['file'],it['size'],it['sha256']))
          print('TOTAL plugins:',len(index))
          PY
          ls -lh "$PKGDIR" | head -60

      - name: Build nanoad and adbyby plugin packages
        working-directory: src
        run: |
          python3 build_extra_plugins.py
          echo "=== final plugin index ==="
          wc -l plugin-repo/plugins.txt
          tail -5 plugin-repo/plugins.txt

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-repo-${{ env.BUILD_DATE }}
          path: src/plugin-repo/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish plugin repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-repo
          name: K2P 插件仓库 (plugin-repo)
          body: |
            独立插件包仓库，供固件「高级设置 → 插件管理」在线下载安装。
            架构：mipsel-linux-musl。每个 .tar.gz 内含二进制 + manifest.json。
            plugins.txt 为固件读取的 TSV 索引，plugins.json 为完整索引。
            共 29 个插件（含 NanoAd 无密码版与 Adbyby）。动态链接插件依赖固件 /lib 中的 musl 运行库（完整固件/插件中心版均含）。
          files: src/plugin-repo/*
